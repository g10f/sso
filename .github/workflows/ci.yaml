name: ci

on:
  push:
    # releases are driven by version tags created by git release (e.g. 5.4.4)
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
env:
  IMAGE: ghcr.io/g10f/sso

jobs:
  # Each platform is built natively on its own runner, without QEMU emulation. The images are pushed
  # without tag (by digest) and combined into one multi-platform image in the merge job.
  build:
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Prepare
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> $GITHUB_ENV  # linux/arm64 -> linux-arm64
        env:
          PLATFORM: ${{ matrix.platform }}

      - name: Checkout
        uses: actions/checkout@v7

      - name: Check Version
        run: |
          VERSION=$(python3 apps/version.py)
          if [ "$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match __version__ $VERSION"
            exit 1
          fi

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v7
        with:
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=${{ env.PLATFORM_PAIR }},mode=max

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          # the tag is checked against __version__ in the build job
          tags: |
            type=raw,value=latest
            type=pep440,pattern={{version}}
            type=sha

      - name: Create manifest list and push
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.IMAGE }}:${{ steps.meta.outputs.version }}

  # Starts the deploy workflow named in the secret DEPLOY_WORKFLOW (owner/repo/workflow file), which deploys the
  # image. DEPLOY_TOKEN can only start that workflow; the result is shown there under Actions.
  # Both are secrets, so their values are masked in the log. Without them (e.g. in a fork) nothing is deployed.
  deploy:
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - name: Start the deploy
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_WORKFLOW: ${{ secrets.DEPLOY_WORKFLOW }}
          VERSION: ${{ github.ref_name }}
        run: |
          if [ -z "$DEPLOY_WORKFLOW" ]; then
            echo "No deploy configured (secret DEPLOY_WORKFLOW is not set), nothing to do."
            exit 0
          fi
          repo="${DEPLOY_WORKFLOW%/*}"
          workflow="${DEPLOY_WORKFLOW##*/}"
          gh api -X POST "repos/$repo/actions/workflows/$workflow/dispatches" \
            -f ref=main -f "inputs[image]=$IMAGE" -f "inputs[version]=$VERSION"
          echo "Deploy of $IMAGE:$VERSION started."
